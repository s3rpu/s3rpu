<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Administrador de Contactos — Ayuntamiento</title>
    <meta name="theme-color" content="#0a246a" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📇</text></svg>" />
    <link rel="stylesheet" href="css/style.css" />
    <script>
      (function () {
        var saved = localStorage.getItem('contactos.theme');
        if (saved === 'dark' || saved === 'light') document.documentElement.setAttribute('data-theme', saved);
      })();
    </script>
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <h1>Administrador de Contactos</h1>
        <span class="brand-sub">Ayuntamiento</span>
      </div>
      <div class="header-actions">
        <label class="icon-btn file-label" title="Importar contactos masivamente desde un Excel o CSV">
          Importar Excel/CSV
          <input type="file" id="excel-input" accept=".xlsx,.xls,.csv" hidden />
        </label>
        <button id="export-excel-btn" class="icon-btn" title="Descargar todos los contactos en un archivo Excel">Exportar a Excel</button>
        <button id="export-btn" class="icon-btn" title="Descargar copia de seguridad de todos los datos">Exportar backup</button>
        <label class="icon-btn file-label" title="Restaurar una copia de seguridad">
          Importar backup
          <input type="file" id="import-input" accept="application/json" hidden />
        </label>
        <button id="theme-toggle-btn" class="icon-btn theme-toggle" title="Cambiar entre modo claro y oscuro">🌙 Oscuro</button>
      </div>
    </header>
    <nav id="tabs" class="tabs"></nav>
    <main id="main" class="main"></main>
    <div id="modal-overlay" class="modal-overlay" hidden></div>
    <div id="toast-stack" class="toast-stack"></div>
    <script src="js/vendor/xlsx.full.min.js"></script>
    <script src="js/vendor/exceljs.min.js"></script>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
